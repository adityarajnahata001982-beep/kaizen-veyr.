<script>
(()=>{'use strict';
const KEY='kaizen-veyr-progress-v1';const APPEARANCE_KEY='kaizen-veyr-appearance-v1';
const navItems=[['dashboard','⌂','Dashboard'],['quests','☷','Quests'],['close','◷','Daily Close'],['shop','◇','Shop'],['inventory','▣','Inventory'],['boss','♜','Boss Arena'],['achievements','✧','Achievements'],['report','▤','Weekly Report'],['settings','⚙','Settings']];

const shopDefaults=[{id:'minor-potion',name:'Minor XP Potion',desc:'Gain 25 XP instantly.',icon:'🧪',price:100,kind:'xp',value:25},{id:'major-potion',name:'Major XP Potion',desc:'Gain 75 XP instantly.',icon:'⚗️',price:250,kind:'xp',value:75},{id:'recovery',name:'Quest Recovery Token',desc:'A token for a future missed quest.',icon:'🛡️',price:150,kind:'item'},{id:'streak-shield',name:'Streak Shield',desc:'Protect one streak when configured.',icon:'❄️',price:200,kind:'item'},{id:'study-boost',name:'Study Boost',desc:'A personal milestone reward token.',icon:'📘',price:150,kind:'item'},{id:'boss-boost',name:'Boss Reward Boost',desc:'A boost token for a future boss.',icon:'⚔️',price:250,kind:'item'},{id:'blue-aura',name:'Blue Aura',desc:'A hunter profile cosmetic.',icon:'🔹',price:100,kind:'cosmetic'},{id:'violet-aura',name:'Violet Aura',desc:'A shadow-touched profile cosmetic.',icon:'🟣',price:150,kind:'cosmetic'},{id:'shadow-particles',name:'Shadow Particles',desc:'A visual reward for your profile.',icon:'🌌',price:250,kind:'cosmetic'},{id:'hunter-frame',name:'Hunter Border',desc:'An animated-frame unlock token.',icon:'🪬',price:300,kind:'cosmetic'},{id:'theme-card',name:'Custom Status Card',desc:'Unlock a profile card style.',icon:'🃏',price:400,kind:'cosmetic'},{id:'s-rank-frame',name:'S-Rank Frame',desc:'A high-tier cosmetic reward.',icon:'👑',price:750,kind:'cosmetic'}];

function save(){try{state.shop=structuredClone(shopDefaults).map(d=>({...d,...((state.shop||[]).find(i=>i.id===d.id)||{}),price:d.price,name:d.name,desc:d.desc,icon:d.icon,kind:d.kind,value:d.value}));state.player=String(state.player||'Hunter').trim().slice(0,32)||'Hunter';const progress={...state};delete progress.appearance;localStorage.setItem(KEY,JSON.stringify(progress));localStorage.setItem(APPEARANCE_KEY,JSON.stringify(state.appearance||{}));return true}catch(e){toast('Could not save on this device. Export your data as a backup.','error');return false}}

function rank(l){return l<=5?'E':l<=10?'D':l<=20?'C':l<=30?'B':l<=40?'A':'S'}
function addActivity(text){state.activity.unshift({id:uid(),date:new Date().toISOString(),text});state.activity=state.activity.slice(0,100)}
function grantXP(amount,reason){if(!Number.isFinite(amount)||amount===0)return;state.xp+=amount;const ev=[];while(state.level<50&&state.xp>=threshold(state.level)){state.xp-=threshold(state.level);state.level++;const coinReward=state.level<=10?25:state.level<=20?50:state.level<=30?75:state.level<=40?100:200;state.coins+=coinReward;state.transactions.unshift({id:uid(),date:new Date().toISOString(),type:'level-up',label:'Reached Level '+state.level,cost:0,balance:state.coins,detail:'+'+coinReward+' coins'});ev.push('LEVEL UP — Level '+state.level+' · +'+coinReward+' coins');}if(state.level>=50){state.xp=Math.min(state.xp,threshold(50))}addActivity((amount>0?'+':'')+amount+' XP · '+reason);if(ev.length)levelUp(ev.join('\n'));return ev}
function levelUp(msg){if(state.settings.sound)playTone();if(!state.settings.animations){toast(msg.replace(/\n/g,' · '));return}const levels=[...msg.matchAll(/Level (\d+)/g)].map(m=>m[1]);const finalLevel=levels.length?levels[levels.length-1]:'+';const lines=esc(msg).split('\n').map(x=>`<div class=\"levelup-line\">${x}</div>`).join('');showModal(`<div class=\"levelup-content\" style=\"text-align:center;padding:22px 8px 12px;position:relative;overflow:hidden;animation:levelup .8s cubic-bezier(.2,.85,.25,1) both\"><div class=\"levelup-aura\" style=\"position:absolute;width:190px;height:190px;border:1px solid #38bdf866;border-radius:50%;left:50%;top:76px;transform:translateX(-50%);box-shadow:0 0 35px #38bdf855,inset 0 0 32px #8b5cf633;animation:levelGlow 2.4s ease-in-out infinite;pointer-events:none\"></div><div class=\"levelup-burst\" style=\"position:absolute;width:110px;height:110px;border:2px solid var(--blue);border-radius:50%;left:calc(50% - 55px);top:116px;animation:levelBurst 1s ease-out both;pointer-events:none\"></div><div class=\"levelup-star\" style=\"position:absolute;left:18%;top:100px;color:#f5c451;font-size:22px;animation:levelStar 1.4s .12s ease-out both;pointer-events:none\">✦</div><div class=\"levelup-star\" style=\"position:absolute;right:18%;top:105px;color:#8b5cf6;font-size:25px;animation:levelStar 1.5s .24s ease-out both;pointer-events:none\">✧</div><div style=\"position:relative;z-index:1;font-size:12px;letter-spacing:5px;color:#f5c451;text-shadow:0 0 18px #f5c45188\">✦ &nbsp; RANK ASCENSION &nbsp; ✦</div><div style=\"position:relative;z-index:1;width:112px;height:112px;margin:16px auto 18px;border-radius:28px;display:grid;place-items:center;border:1px solid #48c7ff99;background:linear-gradient(145deg,#12344f,#1d1740);box-shadow:0 0 28px #38bdf855, inset 0 0 24px #8b5cf633;color:#eafaff;font-family:var(--site-font-heading);font-size:39px;font-weight:900;text-shadow:0 0 20px #38bdf8;position:relative;overflow:hidden\"><span class=\"levelup-sweep\" style=\"position:absolute;inset:-20px;width:35%;background:linear-gradient(90deg,transparent,#ffffff55,transparent);animation:levelSweep 1.2s .25s ease-in-out both\"></span><span style=\"position:relative\">${finalLevel}</span></div><div class=\"eyebrow\" style=\"position:relative;z-index:1\">HUNTER EVOLUTION</div><h2 style=\"position:relative;z-index:1;font-family:var(--site-font-heading);font-size:clamp(27px,7vw,36px);letter-spacing:2px;margin:8px 0 12px;color:#f2f9ff;text-shadow:0 0 22px #38bdf866\">LEVEL UP</h2><div style=\"position:relative;z-index:1;display:grid;gap:7px;margin:0 auto 20px;max-width:330px;color:#c9def7;font-size:13px\">${lines}</div><button class=\"btn primary\" style=\"position:relative;z-index:1;min-width:150px;padding:12px 20px;letter-spacing:1px\" onclick=\"window.__closeModal()\">CLAIM ASCENSION</button></div>`,'Hunter System · Level Up')}
function playTone(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();const master=c.createGain();master.gain.value=.65;master.connect(c.destination);const now=c.currentTime;[[523.25,0,.18],[659.25,.12,.2],[783.99,.24,.24],[1046.5,.38,.42]].forEach(([freq,delay,dur],i)=>{const o=c.createOscillator(),g=c.createGain();o.type=i===3?'sine':'triangle';o.frequency.setValueAtTime(freq,now+delay);g.gain.setValueAtTime(.0001,now+delay);g.gain.exponentialRampToValueAtTime(i===3?.13:.09,now+delay+.025);g.gain.exponentialRampToValueAtTime(.0001,now+delay+dur);o.connect(g);g.connect(master);o.start(now+delay);o.stop(now+delay+dur+.03)});setTimeout(()=>{try{c.close()}catch(e){}},1600)}catch(e){}}
function toast(msg,type=''){let el=document.getElementById('notice');if(el)el.remove();el=document.createElement('div');el.id='notice';el.className='notice '+type;el.textContent=msg;document.body.appendChild(el);clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.remove(),3300)}
function showModal(body,title=''){document.getElementById('overlays').innerHTML=`<div class="modalback" onclick="if(event.target===this)window.__closeModal()"><div class="modal"><div class="modalhead"><h2>${esc(title)}</h2><button class="xbtn" onclick="window.__closeModal()" aria-label="Close">×</button></div>${body}</div></div>`;}
window.__closeModal=()=>document.getElementById('overlays').innerHTML='';
function nav(){const html=navItems.map(([id,ico,label])=>`<button class="${current===id?'active':''}" onclick="window.go('${id}')"><span class="ico">${ico}</span><span>${label}</span></button>`).join('');document.getElementById('sidenav').innerHTML=html;document.getElementById('mobilenav').innerHTML=navItems.slice(0,5).concat([navItems[5],navItems[8]]).map(([id,ico,label])=>`<button class="${current===id?'active':''}" onclick="window.go('${id}')"><span>${ico}</span>${label}</button>`).join('')}
window.go=id=>{current=id;render()};
function shellHead(title,desc,eyebrow='SYSTEM MODULE',actions=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function cardHead(title,sub='',action=''){return `<div class="sectionhead"><h2>${title}</h2><div style="display:flex;align-items:center;gap:10px"><span>${sub}</span>${action}</div></div>`}
function xpPct(){return Math.min(100,Math.round(state.xp/threshold(state.level)*100))}
function stats(){return `<div class="grid stats"><div class="card glow"><div class="stathead">TOTAL LEVEL <span class="staticon">♜</span></div><div class="big">${String(state.level).padStart(2,'0')} <span style="font-size:12px;color:var(--muted)">/ 50</span></div><div class="sub">${rank(state.level)}-RANK HUNTER</div></div><div class="card glow"><div class="stathead">CURRENT XP <span class="staticon">✧</span></div><div class="big blue">${state.xp}<span style="font-size:12px;color:var(--muted)"> / ${threshold(state.level)}</span></div><div class="sub">${xpPct()}% to next level</div></div><div class="card glow"><div class="stathead">HUNTER COINS <span class="staticon" style="color:var(--gold)">◈</span></div><div class="big gold">${state.coins.toLocaleString()}</div><div class="sub">Earned through progression</div></div><div class="card glow"><div class="stathead">QUESTS TODAY <span class="staticon" style="color:var(--green)">✓</span></div><div class="big green">${state.quests.filter(q=>q.done).length}<span style="font-size:12px;color:var(--muted)"> / ${state.quests.length}</span></div><div class="sub">${state.quests.length?Math.round(state.quests.filter(q=>q.done).length/state.quests.length*100):0}% daily completion</div></div></div>`}
function questRow(q){return `<div class="quest ${q.done?'done':''}"><button class="check" aria-label="${q.done?'Uncheck task':'Complete task'}" onclick="window.toggleQuest('${esc(q.id)}')">${q.done?'✓':'○'}</button><div class="questbody"><strong>${esc(q.title)}</strong><small>${esc(q.category||'Custom')} · ${esc(q.desc||'')}</small></div><div class="reward">${q.done?'CLAIMED':'+'+(q.xp||0)+' XP'}</div></div>`}
function dashboard(){let done=state.quests.filter(q=>q.done).length;return `${shellHead('Hunter Dashboard','Your real-world progress, translated into hunter progression.','SYSTEM OVERVIEW',`<button class="btn" onclick="go('quests')">＋ Manage Quests</button><button class="btn primary" onclick="go('close')">Close Day →</button>`)}${stats()}<div class="grid dashgrid"><div class="grid"><div class="card hero">${cardHead('Hunter Status','PROFILE ACTIVE')}<div class="rankline"><div class="rankbadge">${rank(state.level)}</div><div><div class="levelnum"><strong>LEVEL ${state.level}</strong> · ${rank(state.level)}-RANK HUNTER</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${esc(state.player||'Hunter')} · Discipline Protocol</div></div></div><div class="progressline"><span>LEVEL PROGRESSION</span><b>${state.xp} / ${threshold(state.level)} XP</b></div><div class="track"><span style="width:${xpPct()}%"></span></div><div class="statusline" style="margin-top:10px"><span>${xpPct()}% complete</span><span>Next: Level ${Math.min(50,state.level+1)}</span></div></div><div class="card">${cardHead('Daily Quests',`${done}/${state.quests.length} complete`,`<button class="btn ghost" onclick="go('quests')">View all ↗</button>`)}<div class="questlist">${state.quests.slice(0,6).map(questRow).join('')||'<div class="empty">No quests yet. Add your first quest.</div>'}</div><div style="margin-top:13px;display:flex;justify-content:space-between;align-items:center"><span class="tiny">Rewards are logged once per quest per day.</span><button class="btn primary" onclick="go('close')">Daily Close</button></div></div></div><div class="grid"><div class="card">${cardHead('Boss Arena','WEEKLY TARGET')}<div style="display:flex;gap:13px;align-items:center"><div class="rankbadge" style="color:#fb7185;border-color:#773b54;background:#281727">♜</div><div><strong style="font-size:13px">${esc(state.boss.name)}</strong><div class="tiny" style="margin-top:4px">${state.boss.done} / ${state.boss.goal} eligible tasks completed</div></div></div><div class="bossbar"><span style="width:${Math.min(100,state.boss.done/state.boss.goal*100)}%"></span></div><div class="statusline"><span>Boss progress</span><b>${Math.round(Math.min(100,state.boss.done/state.boss.goal*100))}%</b></div><button class="btn" style="width:100%;margin-top:14px" onclick="go('boss')">Enter Boss Arena →</button></div><div class="card">${cardHead('Weekly Focus','THIS WEEK')}<div class="split"><div class="mini-stat"><span>Study hours</span><strong>${Number(state.weekStudy||0).toFixed(1)}h</strong></div><div class="mini-stat"><span>Workouts logged</span><strong>${state.weekWorkouts||0}</strong></div><div class="mini-stat"><span>Current streak</span><strong class="blue">${state.streak||0} days</strong></div><div class="mini-stat"><span>Items owned</span><strong>${state.inventory.length}</strong></div></div><button class="btn ghost" style="margin-top:13px;width:100%" onclick="go('report')">Open Weekly Report →</button></div><div class="card">${cardHead('Recent Activity','LATEST EVENTS')}<div class="activity">${state.activity.slice(0,4).map(a=>`<div class="activityrow"><div class="activitydot"></div><div><p>${esc(a.text)}</p><small>${fmtDate(a.date)} · ${fmtTime(a.date)}</small></div></div>`).join('')||'<div class="empty">No activity recorded yet.</div>'}</div></div></div></div>`}
function questsPage(){return `${shellHead('Quest Board','Create and manage the actions that drive your progression.','QUEST MANAGEMENT',`<button class="btn primary" onclick="window.taskModal()">＋ Create Quest</button>`)}<div class="grid pagegrid"><div class="card full">${cardHead('Today’s Quest List',`${state.quests.filter(q=>q.done).length} completed · ${state.quests.filter(q=>!q.done).length} active`)}<div class="questlist">${state.quests.map(q=>`<div class="quest ${q.done?'done':''}"><button class="check" aria-label="${q.done?'Uncheck task':'Complete task'}" onclick="window.toggleQuest('${esc(q.id)}')">${q.done?'✓':'○'}</button><div class="questbody"><strong>${esc(q.title)}</strong><small>${esc(q.category)} · ${esc(q.desc)} · ${q.xp} XP</small></div><button class="btn ghost" onclick="editQuest('${esc(q.id)}')">Edit</button><button class="btn ghost" onclick="deleteQuest('${esc(q.id)}')">×</button></div>`).join('')||'<div class="empty">No quests. Create one to begin.</div>'}</div><p class="tiny" style="margin-top:14px">Quest rewards are recorded once per day. Unchecking a quest reverses that quest’s XP and coin rewards for today.</p></div><div class="card">${cardHead('Quick Completion','DAILY LOG')}<p class="tiny">Core quest completion is a manual log. Mark only activities you actually completed.</p><div class="questlist">${state.quests.filter(q=>!q.done).slice(0,4).map(questRow).join('')||'<div class="empty">All current quests are completed.</div>'}</div></div><div class="card">${cardHead('Reward Rules','CURRENT CONFIG')}<div class="settingrow"><div><strong>Study session</strong><small>Per completed focused hour</small></div><b class="blue">+15 XP</b></div><div class="settingrow"><div><strong>Workout</strong><small>At least 30 minutes</small></div><b class="blue">+20 XP</b></div><div class="settingrow"><div><strong>Early rising</strong><small>Wake by 5:30 AM</small></div><b class="blue">+10 XP</b></div><div class="settingrow"><div><strong>Reading</strong><small>10 pages</small></div><b class="blue">+10 XP</b></div><p class="tiny">These are the prototype's current defaults. Edit XP values per quest.</p></div></div>`}
function revokeXP(amount,reason){if(!Number.isFinite(amount)||amount<=0)return;let remaining=amount;while(remaining>0){if(state.xp>=remaining){state.xp-=remaining;remaining=0;break;}remaining-=state.xp;state.xp=0;if(state.level<=1){remaining=0;break;}const oldLevel=state.level;state.level--;state.xp=threshold(state.level)-remaining;remaining=0;if(state.xp<0){remaining=-state.xp;state.xp=0;}const coinReward=oldLevel<=10?25:oldLevel<=20?50:oldLevel<=30?75:oldLevel<=40?100:200;state.coins=Math.max(0,state.coins-coinReward);const ix=state.transactions.findIndex(t=>t.type==='level-up'&&t.label==='Reached Level '+oldLevel);if(ix>=0)state.transactions.splice(ix,1);}addActivity('-'+amount+' XP · '+reason)}
window.toggleQuest=id=>{const q=state.quests.find(x=>x.id===id);if(!q)return;if(state.closedDays.includes(today()))return toast('Today is closed. Reopen through the correction workflow first.','error');if(q.done){const tx=state.transactions.find(t=>t.type==='quest'&&t.questId===q.id&&t.dateKey===today());if(tx){const reward=Number(tx.rewardXP??q.xp)||0;const coinTx=state.transactions.find(t=>t.type==='quest-coins'&&t.questId===q.id&&t.dateKey===today());if(reward>0)revokeXP(reward,'Quest unchecked: '+q.title);if(coinTx){state.coins=Math.max(0,state.coins-Number(coinTx.rewardCoins??q.coins??0));}state.transactions=state.transactions.filter(t=>!((t.type==='quest'||t.type==='quest-coins')&&t.questId===q.id&&t.dateKey===today()));if(q.id==='workout')state.weekWorkouts=Math.max(0,Number(state.weekWorkouts||0)-1);if(q.id==='study')state.weekStudy=Math.max(0,Number(state.weekStudy||0)-Number(q.progress||0));if(state.boss.active&&!state.boss.claimed)state.boss.done=Math.max(0,state.boss.done-1);}q.done=false;delete q.completedAt;addActivity('Reopened quest: '+q.title+'. Today’s quest reward was reversed.');save();render();return toast('Quest unchecked; today’s XP reward was reversed.')}q.done=true;q.completedAt=new Date().toISOString();const already=state.transactions.some(t=>t.type==='quest'&&t.questId===q.id&&t.dateKey===today());if(!already){const reward=Number(q.xp)||0;if(reward)grantXP(reward,'Quest completed: '+q.title);if(Number(q.coins)>0){state.coins+=Number(q.coins);state.transactions.unshift({id:uid(),date:new Date().toISOString(),dateKey:today(),type:'quest-coins',questId:q.id,label:q.title,cost:0,balance:state.coins,rewardCoins:Number(q.coins),detail:'+'+q.coins+' coins'})}state.transactions.unshift({id:uid(),date:new Date().toISOString(),dateKey:today(),type:'quest',questId:q.id,label:q.title,cost:0,balance:state.coins,rewardXP:reward,detail:'+'+reward+' XP'});if(q.id==='study')state.weekStudy=Number(state.weekStudy||0)+Number(q.progress||0);if(q.id==='workout')state.weekWorkouts=Number(state.weekWorkouts||0)+1;if(state.boss.active&&!state.boss.claimed)state.boss.done=Math.min(state.boss.goal,state.boss.done+1);toast('Quest complete · +'+reward+' XP')}else toast('This quest reward was already counted today.');save();render()};
window.taskModal=()=>{showModal(`<form onsubmit="window.saveQuest(event)"><div class="field"><label>Quest title</label><input name="title" required maxlength="80" placeholder="e.g. Solve 25 physics problems"></div><div class="field"><label>Description</label><textarea name="desc" maxlength="240" placeholder="What does completion mean?"></textarea></div><div class="formrow"><div class="field"><label>Category</label><select name="category"><option>Study</option><option>Workout</option><option>Reading</option><option>Habit</option><option>Personal</option><option>Custom</option></select></div><div class="field"><label>XP reward</label><input name="xp" type="number" min="0" max="1000" value="15" required></div></div><div class="field"><label>Coin reward</label><input name="coins" type="number" min="0" max="10000" value="0"></div><button class="btn primary" type="submit">Create Quest</button></form>`,'Create Quest')};
window.saveQuest=e=>{e.preventDefault();const f=new FormData(e.target);state.quests.push({id:uid(),title:String(f.get('title')).trim(),desc:String(f.get('desc')).trim(),category:String(f.get('category')),xp:Number(f.get('xp')),coins:Number(f.get('coins')),difficulty:'Custom',done:false});addActivity('Created quest: '+String(f.get('title')).trim());save();window.__closeModal();render();toast('Quest created.')};
window.editQuest=id=>{const q=state.quests.find(q=>q.id===id);if(!q)return;showModal(`<form onsubmit="window.updateQuest(event,'${esc(id)}')"><div class="field"><label>Title</label><input name="title" value="${esc(q.title)}" required maxlength="80"></div><div class="field"><label>Description</label><input name="desc" value="${esc(q.desc)}" maxlength="240"></div><div class="formrow"><div class="field"><label>Category</label><input name="category" value="${esc(q.category)}"></div><div class="field"><label>XP reward</label><input name="xp" type="number" min="0" max="1000" value="${q.xp}" required></div></div><div class="field"><label>Coin reward</label><input name="coins" type="number" min="0" max="10000" value="${q.coins||0}"></div><button class="btn primary">Save changes</button></form>`,'Edit Quest')};
window.updateQuest=(e,id)=>{e.preventDefault();const q=state.quests.find(q=>q.id===id);if(!q)return;const f=new FormData(e.target);q.title=String(f.get('title')).trim();q.desc=String(f.get('desc')).trim();q.category=String(f.get('category'));q.xp=Number(f.get('xp'));q.coins=Number(f.get('coins'));addActivity('Edited quest: '+q.title);save();window.__closeModal();render();toast('Quest updated.')};
window.deleteQuest=id=>{const q=state.quests.find(q=>q.id===id);if(!q)return;if(!confirm('Delete quest “'+q.title+'”? Existing reward history will remain.'))return;state.quests=state.quests.filter(q=>q.id!==id);addActivity('Deleted quest: '+q.title);save();render();toast('Quest deleted; ledger preserved.')};
function closePage(){const closed=state.closedDays.includes(today());return `${shellHead('Daily Close','Review your day and apply any eligible penalties exactly once.','DAILY PROTOCOL')}<div class="grid pagegrid"><div class="card">${cardHead('Day Status',closed?'CLOSED':'OPEN')}<div class="rankline"><div class="rankbadge" style="color:${closed?'var(--green)':'var(--gold)'}">${closed?'✓':'◷'}</div><div><strong style="font-size:15px">${closed?'Daily report sealed':'Day is still open'}</strong><div class="tiny" style="margin-top:4px">${fmtDate(today())}</div></div></div><div class="closebanner" style="margin-top:16px">Penalties are calculated only when you close the day. This is a fresh start. No previous daily records are carried over.</div><div class="settingrow"><div><strong>Focused study</strong><small>Target ${state.settings.studyTarget} hours · penalty below ${state.settings.studyMinimum} hours</small></div><strong>${Number(state.quests.find(q=>q.id==='study')?.progress||0)}h logged</strong></div><div class="settingrow"><div><strong>Phone distraction</strong><small>Penalty only above 2h 30m</small></div><strong>${state._phoneUsage||'Not logged'}</strong></div><div class="settingrow"><div><strong>Quests completed</strong><small>Manual logs for today</small></div><strong>${state.quests.filter(q=>q.done).length}/${state.quests.length}</strong></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="btn" onclick="window.closeInputs()" ${closed?'disabled':''}>Enter Daily Metrics</button><button class="btn primary" onclick="window.closeDay()" ${closed?'disabled':''}>${closed?'Day Already Closed':'Confirm & Close Day'}</button></div></div><div class="card">${cardHead('Closing Rules','AUDIT-SAFE')}<div class="settingrow"><div><strong>Study penalty</strong><small>Applied if focused study is below configured minimum</small></div><b class="red">−${state.settings.studyPenalty} XP</b></div><div class="settingrow"><div><strong>Phone penalty</strong><small>Strictly greater than 2h 30m</small></div><b class="red">−${state.settings.phonePenalty} XP</b></div><div class="settingrow"><div><strong>Duplicate protection</strong><small>One close transaction per date</small></div><span class="pill success">Enabled</span></div><p class="tiny" style="margin-top:14px">You can record your study hours and mobile usage before closing. A correction is logged rather than silently deducting a penalty twice.</p></div><div class="card full">${cardHead('Recent Close History','LOCKED RECORDS')}<div class="tablewrap"><table><thead><tr><th>Date</th><th>Status</th><th>Summary</th><th>XP delta</th></tr></thead><tbody>${state.history.slice().reverse().map(h=>`<tr><td>${esc(h.date)}</td><td><span class="pill ${h.locked?'goldpill':'success'}">${h.locked?'LOCKED':'CLOSED'}</span></td><td>${esc(h.summary)}</td><td class="${h.xpDelta<0?'red':'green'}">${h.xpDelta>0?'+':''}${h.xpDelta}</td></tr>`).join('')}</tbody></table></div></div></div>`}
window.closeInputs=()=>{const study=Number(state.quests.find(q=>q.id==='study')?.progress||0);showModal(`<form onsubmit="window.saveCloseMetrics(event)"><div class="field"><label>Focused study hours today</label><input name="study" type="number" min="0" max="24" step="0.25" value="${study}" required></div><div class="field"><label>Mobile distraction time (hours, decimals allowed)</label><input name="phone" type="number" min="0" max="24" step="0.05" value="${state._phoneHours||0}" required><small class="tiny">Example: 2.5 means exactly 2 hours 30 minutes and does not trigger the phone penalty.</small></div><button class="btn primary">Save Metrics</button></form>`,'Daily Metrics')};
window.saveCloseMetrics=e=>{e.preventDefault();const f=new FormData(e.target);const study=Number(f.get('study')),phone=Number(f.get('phone'));const q=state.quests.find(q=>q.id==='study');if(q)q.progress=study;state._phoneHours=phone;state._phoneUsage=Math.floor(phone)+'h '+Math.round((phone%1)*60)+'m';addActivity('Updated daily metrics: '+study+' study hours, phone usage '+state._phoneUsage+'.');save();window.__closeModal();render();toast('Daily metrics saved.')};
window.closeDay=()=>{if(state.closedDays.includes(today()))return toast('This day has already been closed.','error');const study=Number(state.quests.find(q=>q.id==='study')?.progress||0),phone=Number(state._phoneHours||0);let delta=0,events=[];const hourlyStudyXP=Math.min(4,Math.floor(study))*15;const studyQuestTx=state.transactions.find(t=>t.type==='quest'&&t.questId==='study'&&t.dateKey===today());const studyQuestXP=studyQuestTx?Math.max(0,Number(studyQuestTx.rewardXP)||0):0;const studyXP=Math.max(0,hourlyStudyXP-Math.min(hourlyStudyXP,studyQuestXP));if(studyXP){delta+=studyXP;events.push('Study reward: +'+studyXP+' XP ('+Math.min(4,Math.floor(study))+' completed hours)')}if(study<state.settings.studyMinimum){delta-=state.settings.studyPenalty;events.push('Study below '+state.settings.studyMinimum+'h: −'+state.settings.studyPenalty+' XP')}if(phone>state.settings.phoneThreshold){delta-=state.settings.phonePenalty;events.push('Phone usage above 2h30m: −'+state.settings.phonePenalty+' XP')}if(delta)grantXP(delta,'Daily close: '+events.join('; '));if(!delta)events.push('No XP rewards or penalties triggered.');state.closedDays.push(today());state.history.push({id:uid(),date:today(),locked:false,summary:`Study ${study}h; phone ${state._phoneUsage||'0h 0m'}. ${events.join('; ')}`,xpDelta:delta,coinsDelta:0,events});state.transactions.unshift({id:uid(),date:new Date().toISOString(),dateKey:today(),type:'daily-close',label:'Daily close',cost:0,balance:state.coins,detail:events.join('; ')});if(studyXP)state.transactions.unshift({id:uid(),date:new Date().toISOString(),dateKey:today(),type:'study-hours',label:'Focused study',cost:0,balance:state.coins,detail:'+'+studyXP+' XP for '+Math.min(4,Math.floor(study))+' completed hours'});addActivity('Daily close sealed: '+(events.join('; ')||'no penalties'));save();render();toast('Day closed. '+(events.join(' · ')||'No penalties triggered.'))};
function shopPage(){let locked=state.level<11;return `${shellHead('Hunter Exchange','Spend earned coins on personal rewards and unlockables.','REWARD ECONOMY')}<div class="card hero" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap"><div><div class="eyebrow">AVAILABLE BALANCE</div><div class="big gold" style="font-size:32px;margin-top:8px">◈ ${state.coins.toLocaleString()} <span style="font-size:12px;color:var(--muted)">HUNTER COINS</span></div><div class="sub">Purchases are recorded in your transaction ledger.</div></div><div style="text-align:right"><span class="pill ${locked?'warn':'success'}">${locked?'LOCKED UNTIL LEVEL 11':'ACCESS GRANTED'}</span><div class="tiny" style="margin-top:8px">${locked?'Reach Level 11 to unlock purchases.':'Shop access available.'}</div></div></div></div><div class="card">${cardHead('Available Rewards',`${state.shop.length} items`)}<div class="itemgrid">${state.shop.map(i=>`<div class="shopitem ${locked?'locked':''}"><div class="shopicon">${esc(i.icon||'◇')}</div><h3>${esc(i.name)}</h3><p>${esc(i.desc)}</p><div class="shopfoot"><b>◈ ${Number(i.price).toLocaleString()}</b><button class="btn ${locked?'':'primary'}" ${locked?'disabled':''} onclick="window.buyItem('${esc(i.id)}')">Purchase</button></div></div>`).join('')}</div><p class="tiny" style="margin-top:14px">Shop prices and rewards are system-controlled. XP potions grant XP immediately; other items enter your inventory.</p></div><div class="card" style="margin-top:16px">${cardHead('Transaction Ledger','RECENT')}<div class="tablewrap"><table><thead><tr><th>Item / Event</th><th>Type</th><th>Detail</th><th>Balance</th><th>Date</th></tr></thead><tbody>${state.transactions.slice(0,12).map(t=>`<tr><td>${esc(t.label)}</td><td>${esc(t.type)}</td><td>${esc(t.detail||'—')}</td><td>◈ ${Number(t.balance||0).toLocaleString()}</td><td>${fmtDate(t.date)}</td></tr>`).join('')||'<tr><td colspan="5">No transactions recorded yet.</td></tr>'}</tbody></table></div></div>`}
window.buyItem=id=>{if(state.level<11)return toast('Shop locked until Level 11.','error');const i=state.shop.find(i=>i.id===id);if(!i)return toast('Item unavailable.','error');if(state.coins<i.price)return toast('Not enough coins. No coins were deducted.','error');if(!confirm(`Purchase ${i.name} for ${i.price} coins?`))return;state.coins-=i.price;if(i.kind==='xp'){grantXP(i.value,'Purchased '+i.name);state.transactions.unshift({id:uid(),date:new Date().toISOString(),type:'purchase',label:i.name,cost:i.price,balance:state.coins,detail:'-'+i.price+' coins; +'+i.value+' XP'})}else{state.inventory.push({id:uid(),itemId:i.id,name:i.name,icon:i.icon,kind:i.kind,acquiredAt:new Date().toISOString(),equipped:false});state.transactions.unshift({id:uid(),date:new Date().toISOString(),type:'purchase',label:i.name,cost:i.price,balance:state.coins,detail:'-'+i.price+' coins; added to inventory'})}addActivity('Purchased '+i.name+' for '+i.price+' coins.');save();render();toast(i.name+' purchased.')};
function inventoryPage(){return `${shellHead('Inventory','Everything you have earned or purchased.','HUNTER STORAGE')}<div class="card">${cardHead('Owned Items',`${state.inventory.length} items`)}${state.inventory.length?`<div class="itemgrid">${state.inventory.map(i=>`<div class="shopitem"><div class="shopicon">${esc(i.icon||'◇')}</div><h3>${esc(i.name)}</h3><p>${esc(i.kind)} · acquired ${fmtDate(i.acquiredAt)}</p><div class="shopfoot"><span class="pill ${i.equipped?'success':''}">${i.equipped?'EQUIPPED':'OWNED'}</span><button class="btn" onclick="window.useItem('${esc(i.id)}')">${i.kind==='xp'?'Use':i.equipped?'Unequip':'Equip'}</button></div></div>`).join('')}</div>`:'<div class="empty">Your inventory is empty. Complete quests and level up to earn coins, then visit the Hunter Exchange.</div>'}</div><div class="card" style="margin-top:16px">${cardHead('Inventory Rules','ITEM SAFETY')}<p class="tiny">Items remain in your inventory until you use, equip, or explicitly remove them. Cosmetic equipment does not alter XP or rewards. Utility tokens are tracked as owned items in this prototype.</p></div>`}
window.useItem=id=>{const i=state.inventory.find(x=>x.id===id);if(!i)return;if(i.kind==='cosmetic'){i.equipped=!i.equipped;addActivity((i.equipped?'Equipped ':'Unequipped ')+i.name);save();render();return toast(i.name+(i.equipped?' equipped.':' unequipped.'))}if(!confirm('Mark '+i.name+' as used? This cannot be undone.'))return;state.inventory=state.inventory.filter(x=>x.id!==id);addActivity('Used inventory item: '+i.name+'.');save();render();toast(i.name+' marked as used. No automatic benefit applied unless configured.')};
function bossPage(){let pct=Math.round(Math.min(100,state.boss.done/state.boss.goal*100));return `${shellHead('Boss Arena','A weekly boss measures consistent execution, not intention.','WEEKLY ENCOUNTER',`<button class="btn" onclick="window.editBoss()">Configure Boss</button>`)}<div class="grid pagegrid"><div class="card hero full"><div class="rankline"><div class="rankbadge" style="color:#fb7185;border-color:#773b54;background:#281727;font-size:28px">♜</div><div><div class="eyebrow" style="color:#fb7185">${state.boss.active?'ACTIVE ENCOUNTER':'ENCOUNTER INACTIVE'}</div><h2 style="font-size:23px;margin:4px 0">${esc(state.boss.name)}</h2><div class="tiny">Weekly objective · Ends ${esc(state.boss.ends||'Sunday')}</div></div></div><div style="display:flex;justify-content:space-between;margin-top:24px;font-size:11px"><span>Objective progress</span><b>${state.boss.done} / ${state.boss.goal}</b></div><div class="bossbar"><span style="width:${pct}%"></span></div><div class="statusline"><span>${pct}% completed</span><span>${Math.max(0,state.boss.goal-state.boss.done)} remaining</span></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:17px"><button class="btn" onclick="go('quests')">Review eligible quests</button><button class="btn primary" onclick="window.claimBoss()" ${state.boss.claimed||state.boss.done<state.boss.goal?'disabled':''}>${state.boss.claimed?'Reward Claimed':'Claim Boss Reward'}</button></div></div><div class="card">${cardHead('Boss Reward','ON VICTORY')}<div class="split"><div class="mini-stat"><span>XP</span><strong class="blue">+50</strong></div><div class="mini-stat"><span>Coins</span><strong class="gold">+25</strong></div></div><p class="tiny" style="margin-top:12px">Reward can only be claimed once after the configured goal is met.</p></div><div class="card">${cardHead('Encounter Log','THIS WEEK')}<div class="activity">${state.activity.filter(a=>/quest|boss/i.test(a.text)).slice(0,5).map(a=>`<div class="activityrow"><div class="activitydot" window.editBoss=()=>showModal(`<form onsubmit="window.saveBoss(event)"><div class="field"><label>Boss name</label><input name="name" value="${esc(state.boss.name)}" required></div><div class="formrow"><div class="field"><label>Required quest completions</label><input name="goal" type="number" min="1" max="100" value="${state.boss.goal}" required></div><div class="field"><label>Deadline</label><select name="ends"><option ${state.boss.ends==='Sunday'?'selected':''}>Sunday</option><option ${state.boss.ends==='Saturday'?'selected':''}>Saturday</option><option ${state.boss.ends==='Month end'?'selected':''}>Month end</option></select></div></div><label><input type="checkbox" name="active" ${state.boss.active?'checked':''}> Encounter active</label><p class="tiny">Editing the goal below current progress will not erase recorded progress.</p><button class="btn primary" style="margin-top:15px">Save Boss</button></form>`,'Configure Boss');

window.claimBoss=()=>{if(state.boss.claimed||state.boss.done<state.boss.goal)return toast('Boss objective is not complete.','error');state.boss.claimed=true;grantXP(50,'Weekly boss defeated: '+state.boss.name);state.coins+=25;state.transactions.unshift({id:uid(),date:new Date().toISOString(),type:'boss-reward',label:state.boss.name,cost:0,balance:state.coins,detail:'+50 XP; +25 coins'});addActivity('Weekly boss defeated; +50 XP and +25 coins.');save();render();toast('Boss defeated. Rewards granted once.')};

function reportPage(){let total=state.transactions.filter(t=>t.dateKey===today()&&t.type==='quest').length;let completed=state.quests.filter(q=>q.done).length;let last7=state.history.slice(-7);let xpEarned=state.transactions.filter(t=>t.type==='quest').reduce((s,t)=>s+Number((t.detail.match(/\+(\d+) XP/)||[])[1]||0),0);return `${shellHead('Weekly Report','A compact review of consistency, effort, and progression.','ANALYTICS')}<div class="grid stats"><div class="card"><div class="stathead">STUDY HOURS <span class="staticon">◷</span></div><div class="big blue">${Number(state.weekStudy||0).toFixed(1)}h</div><div class="sub">Hours logged this tracker week</div></div><div class="card"><div class="stathead">WORKOUTS <span class="staticon">⚔</span></div><div class="big green">${state.weekWorkouts||0}</div><div class="sub">Workout quests logged</div></div><div class="card"><div class="stathead">QUEST TRANSACTIONS <span class="staticon">✓</span></div><div class="big">${state.transactions.filter(t=>t.type==='quest').length}</div><div class="sub">Unique quest rewards</div></div><div class="card"><div class="stathead">DAYS CLOSED <span class="staticon">▤</span></div><div class="big violet">${state.closedDays.length}</div><div class="sub">Sealed daily reports</div></div></div><div class="grid pagegrid"><div class="card">${cardHead('Focus Distribution','TRACKED AREAS')}<div class="barrow"><span>Study</span><div class="track"><span style="width:${Math.min(100,Number(state.weekStudy||0)/20*100)}%"></span></div><b>${Number(state.weekStudy||0).toFixed(1)}h</b></div><div class="barrow"><span>Workout</span><div class="track"><span style="width:${Math.min(100,Number(state.weekWorkouts||0)/6*100)}%;background:var(--green)"></span></div><b>${state.weekWorkouts||0}</b></div><div class="barrow"><span>Quests</span><div class="track"><span style="width:${Math.min(100,state.transactions.filter(t=>t.type==='quest').length/20*100)}%;background:var(--violet)"></span></div><b>${state.transactions.filter(t=>t.type==='quest').length}</b></div><p class="tiny">This report uses the data currently stored in this browser. It does not infer unlogged activities.</p></div><div class="card">${cardHead('Weakness Radar','AREAS TO REVIEW')}<div class="activity"><div class="activityrow"><div class="activitydot" style="background:var(--red)"></div><div><p>Study consistency</p><small>${Number(state.weekStudy||0)<12?'Below a 12-hour review marker this week.':'On track against the review marker.'}</small></div></div><div class="activityrow"><div class="activitydot" style="background:var(--gold)"></div><div><p>Physical training</p><small>${Number(state.weekWorkouts||0)<3?'Fewer than 3 workout logs recorded.':'3 or more workout logs recorded.'}</small></div></div><div class="activityrow"><div class="activitydot" style="background:var(--blue)"></div><div><p>Daily closure</p><small>${state.closedDays.length===0?'No daily close recorded in this session.':'Daily reports closed: '+state.closedDays.length+'.'}</small></div></div></div></div><div class="card full">${cardHead('Daily Close History','AUDIT TRAIL')}<div class="tablewrap"><table><thead><tr><th>Date</th><th>Summary</th><th>XP change</th></tr></thead><tbody>${last7.slice().reverse().map(h=>`<tr><td>${esc(h.date)}</td><td>${esc(h.summary)}</td><td class="${h.xpDelta<0?'red':'green'}">${h.xpDelta>0?'+':''}${h.xpDelta}</td></tr>`).join('')||'<tr><td colspan="3">No daily close history yet. Start logging your days to build your record.</td></tr>'}</tbody></table></div></div></div>`}
function settingsPage(){return `${shellHead('System Settings','Control your rules and protect your saved progression.','CONFIGURATION',`<button class="btn" onclick="window.exportData()">Export Data</button><button class="btn" onclick="document.getElementById('importfile').click()">Import Data</button>`)}<input id="importfile" type="file" accept="application/json,.json" class="hidden" onchange="window.importData(event)"><div class="grid pagegrid"><div class="card">${cardHead('Player Identity','YOUR DISPLAY NAME')}<p class="tiny">Change your player name at any time. The website name, KAIZEN VEYR — THE HUNTER SYSTEM, always stays the same.</p><form onsubmit="window.savePlayerName(event)"><div class="field"><label>Player name</label><input name="playerName" maxlength=32 value="${esc(state.player||'Hunter')}" required placeholder="Enter your player name"></div><button class="btn primary">Save Player Name</button></form></div><div class="card">${cardHead('Progression Rules','XP & PENALTIES')}<form onsubmit="window.saveSettings(event)"><div class="formrow"><div class="field"><label>Study target (hours)</label><input name="studyTarget" type="number" min="1" max="16" step=".5" value="${state.settings.studyTarget}"></div><div class="field"><label>Study penalty below (hours)</label><input name="studyMinimum" type="number" min="0" max="16" step=".5" value="${state.settings.studyMinimum}"></div><div class="field"><label>Study penalty (XP)</label><input name="studyPenalty" type="number" min="0" max="500" value="${state.settings.studyPenalty}"></div><div class="field"><label>Phone penalty (XP)</label><input name="phonePenalty" type="number" min="0" max="500" value="${state.settings.phonePenalty}"></div></div><div class="field"><label>Phone penalty threshold (hours)</label><input name="phoneThreshold" type="number" min="0" max="24" step=".05" value="${state.settings.phoneThreshold}"><small class="tiny">Keep at 2.5 for the strict “greater than 2h 30m” rule.</small></div><button class="btn primary">Save Rules</button></form></div><div class="card">${cardHead('Interface Preferences','LOCAL ONLY')}<div class="settingrow"><div><strong>Level-up animation</strong><small>Show the level-up panel when progression advances</small></div><input class="switch" type="checkbox" ${state.settings.animations?'checked':''} onchange="window.setPref('animations',this.checked)"></div><div class="settingrow"><div><strong>Level-up sound</strong><small>Level-up chime enabled by default; can be switched off</small></div><input class="switch" type="checkbox" ${state.settings.sound?'checked':''} onchange="window.setPref('sound',this.checked)"></div><div class="settingrow"><div><strong>Accent color</strong><small>Change primary highlight color</small></div><input type="color" value="${esc(state.appearance.accent)}" onchange="window.setAccent(this.value)" style="background:transparent;border:0;width:38px;height:30px"></div><div class="settingrow"><div><strong>Reset everything</strong><small>Clear XP, coins, quests, inventory, history, logs, and settings</small></div><button class="btn danger" onclick="window.resetData()">Reset</button></div></div><div class="card">${cardHead('Shop Catalogue','SYSTEM-LOCKED PRICES')}<p class="tiny">Shop prices are fixed by the Hunter System and cannot be edited. Coins can only be earned or spent through valid system actions; there is no manual coin editor.</p><div class="tablewrap"><table><thead><tr><th>Item</th><th>Fixed Price</th><th>Type</th></tr></thead><tbody>${state.shop.map(i=>`<tr><td>${esc(i.icon)} ${esc(i.name)}</td><td>◈ ${i.price}</td><td>${esc(i.kind||'item')}</td></tr>`).join('')}</tbody></table></div><p class="tiny" style="margin-top:12px">Catalogue and prices are controlled by the system.</p></div><div class="card">${cardHead('Data Integrity','LOCAL STORAGE')}<div class="settingrow"><div><strong>Progress data</strong><small>XP, levels, quests, inventory, and logs</small></div><span class="pill success">Separate key</span></div><div class="settingrow"><div><strong>Daily history</strong><small>Reset clears all previous records</small></div><span class="pill">Fresh start</span></div><div class="settingrow"><div><strong>Storage location</strong><small>This browser/device only; not synced to Lovable</small></div><span class="pill">Local</span></div><p class="tiny" style="margin-top:13px">Export JSON regularly if you need a backup or want to transfer this prototype to another device.</p></div><div class="card full">${cardHead('Recent Activity Audit','LAST 30 EVENTS')}<div class="activity">${state.activity.slice(0,10).map(a=>`<div class="activityrow"><div class="activitydot"></div><div><p>${esc(a.text)}</p><small>${fmtDate(a.date)} · ${fmtTime(a.date)}</small></div></div>`).join('')}</div></div></div>`}
window.savePlayerName=e=>{e.preventDefault();const f=new FormData(e.target);const name=String(f.get('playerName')||'').trim().slice(0,32);if(!name)return toast('Enter a player name.','error');state.player=name;addActivity('Player display name changed to '+name+'.');save();render();toast('Player name updated.')};window.saveSettings=e=>{e.preventDefault();const f=new FormData(e.target);state.settings.studyTarget=Number(f.get('studyTarget'));state.settings.studyMinimum=Number(f.get('studyMinimum'));state.settings.studyPenalty=Number(f.get('studyPenalty'));state.settings.phonePenalty=Number(f.get('phonePenalty'));state.settings.phoneThreshold=Number(f.get('phoneThreshold'));addActivity('Progression rules updated.');save();render();toast('Rules saved.')};window.setPref=(k,v)=>{state.settings[k]=v;save();toast('Preference saved.')};window.setAccent=v=>{state.appearance.accent=v;document.documentElement.style.setProperty('--blue',v);save();toast('Accent updated.')};

window.exportData=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kaizen-veyr-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Data export prepared.')};window.importData=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||!Number.isFinite(x.level)||!Array.isArray(x.quests)||!Array.isArray(x.transactions)||!Array.isArray(x.inventory)||!x.settings)throw new Error('This does not look like a valid Kaizen Veyr backup.');if(!confirm('Import backup and replace current local progress? Export current data first if needed.'))return;state=x;if(!Array.isArray(state.history))state.history=[];if(!state.closedDays)state.closedDays=[];save();render();toast('Backup imported and validated.')}catch(err){toast('Import rejected: '+err.message,'error')}finally{e.target.value=''}};reader.readAsText(file)};window.resetData=()=>{if(!confirm('Start completely fresh? This permanently clears all saved progress in this browser: XP, level progress, coins, quest edits/completions, tasks, inventory, transactions, daily history, activity logs, boss progress, streaks, settings, and appearance. You will restart at Level 1, 0/200 XP, and 0 coins. Export a backup first if you want to keep the old data.'))return;try{localStorage.removeItem(KEY);localStorage.removeItem(APPEARANCE_KEY)}catch(e){}state=fresh();current='dashboard';save();render();toast('Fresh start complete: Level 1 · 0 XP · 0 coins.')};
